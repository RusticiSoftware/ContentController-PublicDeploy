# MH relies on its own version of the playbooks, located in cc-deployment-private.
# Despite this, MH still wants to be informed of any changes that occur in this
# repo incase it is relevant to their hosting needs. For example, MH will probably
# need to port over changes made in roles/mysql-config/**, but they don't need
# changes in roles/mysql-local/**.
name: Inform MH About -public Changes
on:
  pull_request_target:
    types: [closed]
    branches:
      - '[0-9]+.[0-9]+'
    paths:
      - 'roles/apache/**'
      - 'roles/cloudfront/**'
      - 'roles/tomcat/**'
      - 'roles/cc-scorm-engine/**'
      - 'roles/common/**'
      - 'roles/content-controller/**'
      - 'roles/mnt/**'
      - 'roles/mysql-config/**'
      - 'roles/tomcat/**'
      - 'roles/java/**'
      - 'roles/saml/**'
      - 'roles/ssl/**'
      - 'build_ami.yml'
      - 'env.yml'

jobs:
  notify-slack:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    steps:
      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.MH_SLACK_WEBHOOK }}
          # Raw Slack payload makes the text cleaner and less noisy.
          SLACK_CUSTOM_PAYLOAD: '{"text": "<${{ github.event.pull_request._links.html.href }}|cc-deployment-public changes> may need to be ported to MH playbooks. Please review."}'
