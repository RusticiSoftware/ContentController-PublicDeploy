---

  - name: Copy over der file
    copy: src={{ cloudfront_private_key }} dest={{ cc_deploy_path }}/bin/{{ cloudfront_private_key }} owner=root group=tomcat mode=0640
    when: content_authorization == "cookies"
    register: copy_output
    ignore_errors: true

  - name: Copy over pem public key
    copy: src={{ cloudfront_public_key }} dest={{ cc_deploy_path }}/bin/{{ cloudfront_public_key }} owner=root group=tomcat mode=0640
    when: content_authorization == "cookies"
    register: copy_output
    ignore_errors: true

  - name: CloudFront keys not found
    ansible.builtin.fail:
      msg: "Content Authorization is set to 'cookies', but {{ cloudfront_public_key }} or {{ cloudfront_private_key }} was not found. See roles/cloudfront/defaults/main.yml for more information."
    when: copy_output.failed