---
- name: Install MySQL Server
  yum:
    name:
      - mysql-community-server
      - mysql-community-client
    state: latest
  register: mysql_redhat_yum_results

- name: Update MySQL config file
  replace:
    path: "/etc/my.cnf"
    regexp: '\[client-server\]'
    replace: '[mysqld]'

- name: Set default MySQL properties
  lineinfile: dest=/etc/my.cnf regexp="^{{ item.property }}" line='{{ item.property }} = {{ item.value }}'
  notify: restart mysql
  with_items:
    - { property: "sql_mode", value: "\"NO_ENGINE_SUBSTITUTION\"" }
    - { property: "log_bin_trust_function_creators", value: "1" }

- name: Enable mysql_native_password
  lineinfile: dest=/etc/my.cnf regexp="^mysql_native_password" line='mysql_native_password = ON'
  notify: restart mysql
  when: ansible_architecture == "x86_64" and mysql_version == "8.4"

- name: Remove legacy default authentication plugin setting
  lineinfile:
    dest: /etc/my.cnf
    regexp: "^default-authentication-plugin"
    state: absent
  notify: restart mysql
  when: ansible_architecture == "x86_64" and mysql_version == "8.4"

- name: Enable/disable MySQL binary logging state
  vars:
    _mysql_disable_logs: "{{ mysql_disable_binary_logs | default(false) | bool }}"
  lineinfile:
    dest: /etc/my.cnf
    regexp: "^disable-log-bin"
    line: "disable-log-bin"
    insertafter: "^log_bin_trust_function_creators"
    state: "{{ 'present' if _mysql_disable_logs else 'absent' }}"
  notify: restart mysql

- name: Determine zlib version
  block:
  - name: Check existing library
    raw: ls /usr/lib/libz.so.*.*
    register: zlib_version

  - name: Recording existing version
    set_fact:
      upgrade_zlib: zlib_version.stdout is version('/usr/lib/libz.so.1.2.11', '<')
  rescue:
  - name: Recording zlib absence
    set_fact:
      upgrade_zlib: true

- name: Update zlib
  when: upgrade_zlib|bool
  block:
  - name: Download zlib-1.2.11
    get_url:
      url: https://www.zlib.net/fossils/zlib-1.2.11.tar.gz
      dest: /tmp

  - name: Extract zlib-1.2.11
    unarchive:
      remote_src: yes
      src: /tmp/zlib-1.2.11.tar.gz
      dest: /tmp/

    # ./configure saves a log file to ./, so we have to cd into that
    # directory before running the command
  - name: Configure zlib-1.2.11
    raw: (cd /tmp/zlib-1.2.11/ && ./configure --shared --prefix=/usr)

  - name: Build zlib-1.2.11
    make:
      chdir: /tmp/zlib-1.2.11/

  - name: Install zlib-1.2.11
    make:
      chdir: /tmp/zlib-1.2.11/
      target: install

  - name: Clean up after zlib installation
    file:
      path: /tmp/zlib-1.2.11
      state: absent

- name: Start MySQL Server
  service:
    name: "{{ mysql_daemon }}"
    state: started
    enabled: true

- name: Check to see if .my.cnf has been written
  stat: path=/root/.my.cnf
  register: mysql_my_cnf_exists

- name: Run MySQL upgrade tool
  shell: mysql_upgrade
  when: mysql_my_cnf_exists.stat.exists and mysql_redhat_yum_results is changed
  ignore_errors: true

- name: Get the temporary password from the log
  shell: grep 'temporary password' /var/log/mysqld.log | tail -n 1 | awk '{print $NF}'
  register: mysql_temp_password_output
  changed_when: false
  failed_when: false

- name: Check if we can already connect with the expected password
  command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT 1;"
  register: already_reset_check
  ignore_errors: yes
  changed_when: false
  no_log: true

- name: Set initial MySQL root password if necessary
  shell: |
    # Use the temp password to set the permanent password
    TEMP_PASS='{{ mysql_temp_password_output.stdout }}'
    NEW_PASS='{{ mysql_root_password }}'

    mysql --connect-expired-password -u root -p"$TEMP_PASS" -Bse \
      "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '$NEW_PASS'; \
       ALTER USER 'root'@'localhost' PASSWORD EXPIRE NEVER;"
  args:
    executable: /bin/bash
  # Only runs when the previous step
  when: already_reset_check.rc != 0 and mysql_temp_password_output.stdout != ""
  no_log: true

- name: Copy .my.cnf file with root password credentials
  template: src=root.my.cnf.j2 dest=/root/.my.cnf owner=root mode=0600
  when: mysql_root_password is defined

- name: Remove unnecessary validation
  shell: mysql -Bse "UNINSTALL PLUGIN validate_password;"
  args:
    executable: /bin/bash
  register: uninstall_result
  failed_when: 
    - uninstall_result.rc != 0 
    - "'does not exist' not in uninstall_result.stderr"
  when: ansible_os_family == 'RedHat'

- name: Restart MySQL Server
  service:
    name: "{{ mysql_daemon }}"
    state: restarted
  when: mysql_redhat_initial_root_password is defined
