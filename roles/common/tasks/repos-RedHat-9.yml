---
- name: "Copy over rpm for EPEL Repository for RedHat 9 variants"
  copy:
    src: "epel-release-latest-9.noarch.rpm"
    dest: "/tmp/epel-release-latest-9.noarch.rpm"

- name: Install GPG key
  rpm_key:
    key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}
    state: present

- name: Remove legacy MySQL community release package (EL7)
  package:
    name: mysql-community-release-el7-5.noarch
    state: absent

- name: Set MySQL community release RPM suffix for EL{{ ansible_distribution_major_version }}
  set_fact:
    mysql_el_repo_suffix: "{{ ansible_distribution_major_version }}-1"

- name: Fetch MySQL community release RPM
  get_url:
    url: "https://repo.mysql.com/mysql{{ mysql_version | regex_replace('\\.', '') }}-community-release-el{{ mysql_el_repo_suffix }}.noarch.rpm"
    dest: "/tmp/mysql{{ mysql_version | regex_replace('\\.', '') }}-community-release-el{{ mysql_el_repo_suffix }}.noarch.rpm"
    mode: "0644"

- name: Import MySQL RPM signing keys
  rpm_key:
    key: "{{ item }}"
    state: present
  loop:
    - https://repo.mysql.com/RPM-GPG-KEY-mysql-2022
    - https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
    - https://repo.mysql.com/RPM-GPG-KEY-mysql-2025

- name: Install MySQL community YUM/DNF repository
  yum:
    name: "/tmp/mysql{{ mysql_version | regex_replace('\\.', '') }}-community-release-el{{ mysql_el_repo_suffix }}.noarch.rpm"
    state: present

- name: Install pip
  package:
    name: python3-pip
    state: latest
    update_cache: yes

- name: Cleanup temporary RPM
  file:
    path: "/tmp/mysql{{ mysql_version | regex_replace('\\.', '') }}-community-release-el{{ mysql_el_repo_suffix }}.noarch.rpm"
    state: absent