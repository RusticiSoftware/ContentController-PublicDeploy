---

- name: Uninstall openjdk-11
  package:
    name: openjdk-11-jdk
    state: absent

- name: Install prerequisites
  package:
    name:
      - ca-certificates
      - gnupg
      - curl
    state: present

- name: Download and dearmor the Corretto GPG key
  shell:
    # Pipe the downloaded key directly to gpg to dearmor it.
    cmd: "curl -fsSL https://apt.corretto.aws/corretto.key | gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg"
    creates: /usr/share/keyrings/corretto-keyring.gpg
  changed_when: false
  args:
    executable: /bin/bash

- name: Add the Corretto APT repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main"
    state: present
    filename: corretto
    update_cache: yes

- name: Install Amazon Corretto {{ corretto_version }} JDK
  package:
    name: "java-{{ corretto_version }}-amazon-corretto-jdk"
    state: present
